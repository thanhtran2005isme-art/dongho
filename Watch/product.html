<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Chi tiết đồng hồ tại AUREL — xem thông số, tồn kho, thêm vào giỏ hàng và yêu thích.">
  <meta name="theme-color" content="#087b6a"><title>Chi tiết sản phẩm | AUREL</title>
  <link rel="stylesheet" href="storefront.css">
  <script defer src="store.js"></script><script defer src="storefront.js"></script>
</head>
<body>
  <div id="site-header-root"></div>
  <main class="page-shell wrap">
    <nav class="breadcrumb" aria-label="Đường dẫn">
      <a href="home.html">Trang chủ</a><span>/</span>
      <a href="home.html#san-pham">Bộ sưu tập</a><span>/</span>
      <span id="crumb-name">Chi tiết sản phẩm</span>
    </nav>
    <div id="product-root" aria-live="polite">
      <p class="notice">Đang tải thông tin sản phẩm…</p>
    </div>
    <section id="related-section" class="related-section" hidden aria-labelledby="related-heading">
      <h2 id="related-heading">Sản phẩm liên quan</h2>
      <div id="related-grid" class="cards-grid"></div>
    </section>
  </main>
  <div id="site-footer-root"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SF = window.AurelStorefront;
      SF.initShell({ activeNav: 'collection' });

      const root = document.getElementById('product-root');
      const crumb = document.getElementById('crumb-name');
      const relatedSection = document.getElementById('related-section');
      const relatedGrid = document.getElementById('related-grid');
      const productId = SF.getParam('id');

      let db;
      try {
        db = SF.readStore(false);
      } catch {
        root.innerHTML = '<div class="empty-state" data-testid="product-error"><h1>Không thể đọc dữ liệu cửa hàng</h1><p>Dữ liệu trình duyệt có thể đang bị hỏng. Vui lòng kiểm tra lại.</p><div class="actions"><a class="button" href="home.html">Về trang chủ</a></div></div>';
        return;
      }

      const product = db.products.find(p => p.id === productId);
      if (!product) {
        document.title = 'Không tìm thấy sản phẩm | AUREL';
        crumb.textContent = 'Không tìm thấy';
        root.innerHTML = `
          <div class="empty-state" data-testid="product-not-found">
            <h1>Không tìm thấy sản phẩm</h1>
            <p>Mã sản phẩm bạn truy cập không tồn tại hoặc đã bị xóa khỏi dữ liệu cửa hàng.</p>
            <div class="actions">
              <a class="button" href="home.html#san-pham">Khám phá bộ sưu tập</a>
              <a class="button secondary" href="home.html">Về trang chủ</a>
            </div>
          </div>`;
        return;
      }

      document.title = `${product.name} | AUREL`;
      crumb.textContent = product.name;

      const img = SF.resolveProductImage(product);
      const canBuy = product.active && product.stock > 0;
      let wished = SF.isWishlisted(product.id);

      const statusBanner = !product.active
        ? '<div class="notice warn" data-testid="product-inactive-notice"><strong>Sản phẩm đã ngừng kinh doanh.</strong> Bạn vẫn có thể xem thông tin tham khảo nhưng không thể thêm vào giỏ hàng.</div>'
        : product.stock <= 0
          ? '<div class="notice warn" data-testid="product-out-of-stock-notice"><strong>Sản phẩm hiện đã hết hàng.</strong> Vui lòng quay lại sau hoặc lưu vào danh sách yêu thích.</div>'
          : '';

      root.innerHTML = `
        ${statusBanner}
        <div class="product-detail-grid" data-testid="product-detail">
          <div class="product-media">
            <img id="detail-img" src="${SF.esc(img.src)}" data-fallback="${SF.esc(img.fallback)}" alt="${SF.esc(img.alt)}" width="800" height="800">
            <span class="ai-badge">${img.isAI ? 'Ảnh minh họa AI — không phải ảnh chính thức của hãng' : 'Ảnh sản phẩm do cửa hàng cung cấp'}</span>
          </div>
          <div class="product-detail-info">
            <div class="product-meta-top">
              <span class="pill">${SF.esc(product.brand)}</span>
              <span>${SF.esc(product.type)}</span>
              <span>·</span>
              <span>Mã: <strong data-testid="product-code">${SF.esc(product.code)}</strong></span>
            </div>
            <h1 data-testid="product-name">${SF.esc(product.name)}</h1>
            <div class="detail-price" data-testid="product-price">${SF.money(product.price)}</div>
            <p class="detail-stock ${canBuy ? 'in-stock' : 'sold-out'}" data-testid="product-stock">
              ${!product.active ? 'Ngừng kinh doanh' : product.stock > 0 ? `Còn ${product.stock} chiếc trong kho` : 'Hết hàng (0 chiếc)'}
            </p>
            <div class="detail-desc">
              <p>${SF.esc(product.description || 'Thiết kế đồng hồ nằm trong danh mục thực hành của cửa hàng AUREL.')}</p>
            </div>
            <div class="spec-list">
              <div class="spec-item"><small>Thương hiệu</small><strong>${SF.esc(product.brand)}</strong></div>
              <div class="spec-item"><small>Loại đồng hồ</small><strong>${SF.esc(product.type)}</strong></div>
              <div class="spec-item"><small>Mã sản phẩm</small><strong>${SF.esc(product.code)}</strong></div>
              <div class="spec-item"><small>Trạng thái</small><strong>${product.active ? (product.stock > 0 ? 'Đang bán' : 'Hết hàng') : 'Ngừng bán'}</strong></div>
            </div>

            <div class="qty-row">
              <label for="qty-input" style="font-size:14px;font-weight:600">Số lượng</label>
              <div class="qty-stepper">
                <button type="button" id="qty-dec" aria-label="Giảm số lượng" ${canBuy ? '' : 'disabled'}>−</button>
                <input id="qty-input" data-testid="qty-input" type="number" inputmode="numeric" min="1" max="${Math.max(1, product.stock)}" step="1" value="1" ${canBuy ? '' : 'disabled'}>
                <button type="button" id="qty-inc" aria-label="Tăng số lượng" ${canBuy ? '' : 'disabled'}>+</button>
              </div>
              ${canBuy ? `<span class="field-hint">Tối đa ${product.stock} chiếc</span>` : ''}
            </div>

            <div class="detail-actions">
              <button type="button" class="button" id="add-to-cart-btn" data-testid="add-to-cart-btn" ${canBuy ? '' : 'disabled'}>
                ${!product.active ? 'Ngừng kinh doanh' : product.stock > 0 ? 'Thêm vào giỏ hàng' : 'Hết hàng'}
              </button>
              <button type="button" class="button secondary" id="wishlist-btn" data-testid="wishlist-toggle-btn" aria-pressed="${wished}">
                ${wished ? 'Đã yêu thích ♥' : 'Thêm yêu thích ♡'}
              </button>
            </div>

            <div id="action-feedback" role="status" aria-live="polite"></div>
            <p class="field-hint" style="margin-top:16px">Giá và tồn kho đối chiếu trực tiếp từ dữ liệu cửa hàng trên trình duyệt. Đặt hàng trên AUREL là quy trình mô phỏng đồ án.</p>
          </div>
        </div>
      `;

      const qtyInput = document.getElementById('qty-input');
      const qtyDec = document.getElementById('qty-dec');
      const qtyInc = document.getElementById('qty-inc');
      const addBtn = document.getElementById('add-to-cart-btn');
      const wishBtn = document.getElementById('wishlist-btn');
      const feedback = document.getElementById('action-feedback');

      function showFeedback(type, html) {
        feedback.innerHTML = `<div class="notice ${type}" data-testid="product-feedback">${html}</div>`;
      }

      qtyDec.addEventListener('click', () => {
        const cur = Number(qtyInput.value);
        qtyInput.value = String(Math.max(1, (Number.isInteger(cur) ? cur : 1) - 1));
      });
      qtyInc.addEventListener('click', () => {
        const cur = Number(qtyInput.value);
        qtyInput.value = String(Math.min(product.stock, (Number.isInteger(cur) ? cur : 1) + 1));
      });

      addBtn.addEventListener('click', () => {
        const raw = qtyInput.value.trim();
        const num = Number(raw);
        if (raw === '' || !Number.isSafeInteger(num) || num < 1) {
          showFeedback('error', 'Số lượng không hợp lệ. Vui lòng nhập số nguyên từ 1 trở lên.');
          qtyInput.focus();
          return;
        }
        try {
          const res = SF.addToCart(product.id, num);
          showFeedback('success', `Đã thêm <strong>${num}</strong> chiếc vào giỏ (hiện có ${res.quantity} chiếc mẫu này trong giỏ). <a href="cart.html" style="text-decoration:underline;font-weight:600;margin-left:6px">Xem giỏ hàng →</a>`);
        } catch (err) {
          showFeedback('error', SF.esc(err.message));
        }
      });

      wishBtn.addEventListener('click', () => {
        wished = SF.toggleWishlist(product.id);
        wishBtn.setAttribute('aria-pressed', String(wished));
        wishBtn.textContent = wished ? 'Đã yêu thích ♥' : 'Thêm yêu thích ♡';
        showFeedback('success', wished
          ? 'Đã lưu vào danh sách yêu thích. <a href="wishlist.html" style="text-decoration:underline;font-weight:600;margin-left:6px">Xem yêu thích →</a>'
          : 'Đã bỏ sản phẩm khỏi danh sách yêu thích.');
      });

      // Sản phẩm liên quan (cùng thương hiệu hoặc cùng loại, đang kinh doanh)
      const related = db.products
        .filter(p => p.active && p.id !== product.id && (p.brand === product.brand || p.type === product.type))
        .slice(0, 4);
      if (related.length) {
        relatedSection.hidden = false;
        relatedGrid.innerHTML = related.map(p => {
          const rImg = SF.resolveProductImage(p);
          const url = `product.html?id=${encodeURIComponent(p.id)}`;
          return `
            <article class="shop-card">
              <a class="shop-card-img" href="${url}">
                <span class="shop-card-tag">${SF.esc(p.brand)}</span>
                <img src="${SF.esc(rImg.src)}" data-fallback="${SF.esc(rImg.fallback)}" alt="${SF.esc(rImg.alt)}" loading="lazy">
              </a>
              <div class="shop-card-body">
                <small>${SF.esc(p.type)}</small>
                <h3><a href="${url}">${SF.esc(p.name)}</a></h3>
                <div class="shop-card-price">${SF.money(p.price)}</div>
              </div>
            </article>`;
        }).join('');
      }
    });
  </script>
</body>
</html>
