<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Giỏ hàng AUREL — đối chiếu giá và tồn kho theo dữ liệu cửa hàng.">
  <meta name="theme-color" content="#087b6a"><title>Giỏ hàng | AUREL</title>
  <link rel="stylesheet" href="storefront.css">
  <script defer src="store.js"></script><script defer src="storefront.js"></script>
</head>
<body>
  <div id="site-header-root"></div>
  <main class="page-shell wrap">
    <nav class="breadcrumb" aria-label="Đường dẫn">
      <a href="home.html">Trang chủ</a><span>/</span><span>Giỏ hàng</span>
    </nav>
    <div class="page-head">
      <div>
        <h1>Giỏ hàng của bạn</h1>
        <p>Đơn giá và tình trạng tồn kho luôn được đối chiếu trực tiếp từ dữ liệu cửa hàng, không tin giá lưu trong giỏ.</p>
      </div>
      <a class="button secondary small" href="home.html#san-pham">← Tiếp tục mua sắm</a>
    </div>
    <div id="cart-banner" aria-live="polite"></div>
    <div id="cart-root">
      <p class="notice">Đang tải giỏ hàng…</p>
    </div>
  </main>
  <div id="site-footer-root"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SF = window.AurelStorefront;
      SF.initShell({ activeNav: 'cart' });

      const root = document.getElementById('cart-root');
      const banner = document.getElementById('cart-banner');

      function showBanner(type, text) {
        banner.innerHTML = text ? `<div class="notice ${type}" data-testid="cart-feedback">${SF.esc(text)}</div>` : '';
      }

      function render() {
        let resolved;
        try { resolved = SF.getResolvedCart(); } catch { SF.renderStoreError(root); return; }
        if (!resolved.lines.length) {
          root.innerHTML = `
            <div class="empty-state" data-testid="cart-empty">
              <h2>Giỏ hàng đang trống</h2>
              <p>Bạn chưa chọn chiếc đồng hồ nào. Hãy khám phá bộ sưu tập AUREL để thêm sản phẩm yêu thích.</p>
              <div class="actions">
                <a class="button" href="home.html#san-pham">Khám phá bộ sưu tập</a>
                <a class="button secondary" href="wishlist.html">Xem danh sách yêu thích</a>
              </div>
            </div>`;
          return;
        }

        const alerts = [];
        if (resolved.hasPriceChanges) {
          alerts.push('<div class="notice warn" data-testid="cart-price-change-notice"><strong>Lưu ý cập nhật giá:</strong> Một số sản phẩm đã thay đổi giá trong dữ liệu cửa hàng. Tổng tiền bên dưới luôn được tính theo giá hiện hành mới nhất.</div>');
        }
        if (resolved.hasBlockingIssues) {
          alerts.push('<div class="notice error" data-testid="cart-blocking-notice"><strong>Cần xử lý trước khi đặt hàng:</strong> Có sản phẩm hết hàng, ngừng kinh doanh hoặc vượt tồn kho. Vui lòng cập nhật số lượng hoặc xóa sản phẩm không hợp lệ.</div>');
        }

        const itemsHtml = resolved.lines.map(line => {
          const p = line.product;
          const img = p ? SF.resolveProductImage(p) : { src: 'assets/images/aurel-steel.png', fallback: 'assets/images/aurel-steel.png', alt: 'Sản phẩm không còn tồn tại' };
          const url = p ? `product.html?id=${encodeURIComponent(p.id)}` : 'home.html#san-pham';
          const priceDiffHtml = line.priceChanged && line.exists
            ? `<div class="field-hint" style="color:var(--warn)" data-testid="price-changed-${SF.esc(line.productId)}">Giá khi thêm: ${SF.money(line.addedPrice)} → Giá hiện tại: <strong>${SF.money(line.livePrice)}</strong></div>`
            : '';
          const errHtml = line.errorMessage
            ? `<p class="field-error" style="margin-top:6px" data-testid="line-error-${SF.esc(line.productId)}">${SF.esc(line.errorMessage)}</p>`
            : '';
          const canEditQty = line.exists && line.active && line.stock > 0;
          return `
            <article class="cart-item ${line.status !== 'ok' ? 'has-issue' : ''}" data-testid="cart-item-${SF.esc(line.productId)}">
              <a class="cart-thumb" href="${url}">
                <img src="${SF.esc(img.src)}" data-fallback="${SF.esc(img.fallback)}" alt="${SF.esc(img.alt)}">
              </a>
              <div class="cart-item-info">
                <div class="cart-item-meta">${p ? `${SF.esc(p.brand)} · ${SF.esc(p.code)} · Tồn kho: ${p.stock}` : 'Không tìm thấy trong cửa hàng'}</div>
                <h3><a href="${url}">${SF.esc(p ? p.name : line.productId)}</a></h3>
                <div class="cart-item-price" data-testid="line-unit-price-${SF.esc(line.productId)}">${p ? SF.money(line.livePrice) : '—'}</div>
                ${priceDiffHtml}
                ${errHtml}
              </div>
              <div class="cart-item-controls">
                <div class="qty-stepper">
                  <button type="button" data-qty-dec="${SF.esc(line.productId)}" aria-label="Giảm số lượng" ${!canEditQty || line.quantity <= 1 ? 'disabled' : ''}>−</button>
                  <input type="number" data-qty-input="${SF.esc(line.productId)}" aria-label="Số lượng ${SF.esc(p ? p.name : line.productId)}" min="1" max="${Math.max(1, line.stock)}" step="1" value="${line.quantity}" ${canEditQty ? '' : 'disabled'}>
                  <button type="button" data-qty-inc="${SF.esc(line.productId)}" aria-label="Tăng số lượng" ${!canEditQty || line.quantity >= line.stock ? 'disabled' : ''}>+</button>
                </div>
                <div class="cart-line-total" data-testid="line-total-${SF.esc(line.productId)}">${line.status === 'ok' ? SF.money(line.lineTotal) : '—'}</div>
                <button type="button" class="btn danger small" data-remove-item="${SF.esc(line.productId)}" data-testid="remove-item-${SF.esc(line.productId)}">Xóa</button>
              </div>
            </article>`;
        }).join('');

        root.innerHTML = `
          ${alerts.join('')}
          <div class="split-layout">
            <section class="cart-list" aria-label="Danh sách sản phẩm trong giỏ">
              ${itemsHtml}
            </section>
            <aside class="summary-card" aria-label="Tóm tắt giỏ hàng">
              <h2>Tóm tắt đơn</h2>
              <div class="summary-row">
                <span>Tổng số lượng</span>
                <strong data-testid="cart-total-count">${resolved.totalCount} sản phẩm</strong>
              </div>
              <div class="summary-row">
                <span>Phí vận chuyển / thuế</span>
                <span>Chưa áp dụng</span>
              </div>
              <div class="summary-row total">
                <span>Tạm tính</span>
                <strong data-testid="cart-subtotal">${SF.money(resolved.validTotal)}</strong>
              </div>
              <p class="field-hint" style="margin:12px 0 18px">Chưa áp dụng phí vận chuyển, thuế hay mã giảm giá. Đặt hàng mô phỏng tạo đơn nháp trong trang quản lý.</p>
              <div class="form-stack">
                ${resolved.hasBlockingIssues
                  ? '<button type="button" class="button" disabled data-testid="proceed-checkout-btn">Tiến hành đặt hàng</button>'
                  : '<a class="button" href="checkout.html" data-testid="proceed-checkout-btn">Tiến hành đặt hàng →</a>'}
                <a class="button secondary" href="home.html#san-pham">Tiếp tục mua sắm</a>
                <button type="button" class="button danger small" id="clear-cart-btn" data-testid="clear-cart-btn">Xóa toàn bộ giỏ</button>
              </div>
            </aside>
          </div>`;
      }

      root.addEventListener('click', e => {
        const dec = e.target.closest('[data-qty-dec]');
        if (dec) {
          const pid = dec.dataset.qtyDec;
          const item = SF.readCart().items.find(i => i.productId === pid);
          if (!item) return;
          try {
            SF.updateCartItem(pid, Math.max(1, item.quantity - 1));
            showBanner('', '');
            render();
          } catch (err) { showBanner('error', err.message); render(); }
          return;
        }
        const inc = e.target.closest('[data-qty-inc]');
        if (inc) {
          const pid = inc.dataset.qtyInc;
          const item = SF.readCart().items.find(i => i.productId === pid);
          if (!item) return;
          try {
            SF.updateCartItem(pid, item.quantity + 1);
            showBanner('', '');
            render();
          } catch (err) { showBanner('error', err.message); render(); }
          return;
        }
        const rem = e.target.closest('[data-remove-item]');
        if (rem) {
          SF.removeFromCart(rem.dataset.removeItem);
          showBanner('success', 'Đã xóa sản phẩm khỏi giỏ hàng.');
          render();
          return;
        }
        if (e.target.closest('#clear-cart-btn')) {
          SF.clearCart();
          showBanner('success', 'Đã xóa toàn bộ sản phẩm trong giỏ hàng.');
          render();
        }
      });

      root.addEventListener('change', e => {
        const inp = e.target.closest('[data-qty-input]');
        if (!inp) return;
        const pid = inp.dataset.qtyInput;
        try {
          SF.updateCartItem(pid, inp.value);
          showBanner('', '');
        } catch (err) {
          showBanner('error', err.message);
        }
        render();
      });

      window.addEventListener('storage', e => {
        if (e.key === SF.KEYS.store || e.key === SF.KEYS.cart) render();
      });

      render();
    });
  </script>
</body>
</html>
